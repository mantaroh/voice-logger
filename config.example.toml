[app]
poll_interval_seconds = 10
log_level = "INFO"

[usb]
# マウント名（/Volumes/<name> や /media/$USER/<name> の <name>）
device_name = "VOICE_RECORDER"
# 任意。未指定ならOS別デフォルトを自動利用
mount_roots = ["/Volumes", "/media/$USER", "/run/media/$USER", "/mnt"]
# USB内の探索開始ディレクトリ。空ならUSBルート全体
source_subdir = ""
audio_extensions = [".wav", ".mp3", ".m4a", ".aac", ".flac", ".ogg", ".mp4"]

[storage]
base_dir = "~/voice-logger-data"
raw_dir_name = "raw"
transcript_dir_name = "transcripts"
summary_dir_name = "summaries"
state_file_name = ".voice_logger_state.json"

[whisper]
# whisper.cpp の実行ファイル (whisper-cli)
cli_path = "~/.local/share/voice-logger/bin/whisper-cli"
# kotoba-whisper2.2 の gguf / bin モデルパス
model_path = "~/.local/share/voice-logger/models/kotoba-whisper-v2.2/kotoba-whisper-v2.2.bin"
language = "ja"
# 例: ["-t", "8", "-oj"]
extra_args = ["-t", "8"]
# 長時間・ノイズ環境向けパイプライン
enable_denoise = true
# ffmpeg -af に渡すフィルタ
denoise_filter = "afftdn=nf=-25"
enable_vad = true
vad_threshold = 0.5
# 語頭・語尾の欠落防止マージン（0.5〜1.0推奨）
vad_padding_seconds = 0.7
# 2秒未満の無音は同一発話として扱う
vad_min_silence_duration_ms = 2000
# 30秒の壁対策（VAD側）
vad_max_speech_duration_seconds = 30.0
# 念のためチャンク側でも30秒上限を強制
max_chunk_seconds = 30.0

[summarizer]
enabled = true
# openai | anthropic | gemini | openrouter | cloudflare
provider = "openai"
model = "gpt-4o-mini"
# APIキーを格納した環境変数名
api_key_env = "OPENAI_API_KEY"
# openai/openrouter/cloudflare では指定推奨。未指定時はopenai/openrouterのみデフォルトあり
endpoint = "https://api.openai.com/v1/chat/completions"
system_prompt = "以下は会話の文字起こしです。要点、決定事項、TODO、懸念事項を日本語で簡潔に箇条書きしてください。"
